name: Publish Package to npm

on:
  push:
    tags:
      - 'v*' # Triggers on any tag starting with 'v' (e.g. v1.0.0, v2.1.0-beta)

permissions:
  contents: read
  id-token: write # Required for OIDC / Trusted Publishing authentication

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install & Build
        run: |
          npm ci
          npm run build --if-present

      - name: Publish Package
        run: npm publish --provenance --access public --dry-run