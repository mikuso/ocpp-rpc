on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

name: Test Coveralls

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nodeVer:
          - 20
          - 22
          - 24
          - current
    steps:

      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.nodeVer }}

      - name: Run tests
        run: |
          npm ci
          npm run coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
